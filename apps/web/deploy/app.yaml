# Deployment template: review the account, region, and recurring price before creating.
# Merge the website PR into main before deploying this specification.
name: promptshield
region: nyc
services:
  - name: web
    environment_slug: node-js
    github:
      repo: JyothiNandhan/ShellHacks_2026
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci --include=dev && npm run build -w apps/web
    run_command: npm run start -w apps/web
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
# TODO(deploy): add the chosen custom domain after the first successful deployment.
